name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Capacitor CLI
        run: |
          npm install -g @capacitor/cli @capacitor/core
          mkdir www
          cp index.html www/index.html

      - name: Init Capacitor Project
        run: |
          npx cap init ZimoApp com.zimo.ios --web-dir www
          npm install @capacitor/ios
          npx cap add ios

      - name: Build App Payload
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -sdk iphoneos -configuration Release build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
